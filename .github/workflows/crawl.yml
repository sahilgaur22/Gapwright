name: Scheduled Crawl

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Warm up API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "${{ secrets.API_BASE_URL }}/healthz"; then break; fi
            echo "Waiting for API to warm up ($i/20)..."
            sleep 15
          done
      - name: Trigger crawl
        run: |
          curl -fsS -X POST "${{ secrets.API_BASE_URL }}/api/v1/jobs/crawl" \
            -H "X-Crawl-Token: ${{ secrets.CRAWL_TRIGGER_TOKEN }}" \
            -H "Content-Type: application/json" -d '{}'
      - name: Show source budgets
        run: curl -fsS "${{ secrets.API_BASE_URL }}/api/v1/sources"
