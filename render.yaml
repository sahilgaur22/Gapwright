services:
  - type: web
    name: gapwright-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: ENV
        value: production
      - key: ENABLE_PLAYWRIGHT
        value: "false"
      - key: EMBED_DIM
        value: "768"
      - key: DATABASE_URL
        fromDatabase:
          name: gapwright-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini-2.0-flash"
      - key: EMBED_MODEL
        value: "models/text-embedding-004"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: ENABLED_SOURCES
        value: "adzuna,jooble,remotive,remoteok,wwr_rss,fixture"
      - key: CRAWL_PAIRS
        value: "Data Scientist|Bangalore;Backend Developer|Delhi"
      - key: CRAWL_TRIGGER_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: gapwright-db
    plan: free
    region: singapore
    databaseName: gap
    user: gapwright_user
