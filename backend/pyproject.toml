[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapwright-backend"
version = "0.1.0"
description = "Automated Syllabus-to-Industry Gap Analyzer backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gapwright Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "greenlet>=3.0.3",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    "email-validator>=2.1.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "apscheduler>=3.10.4",
    "reportlab>=4.0.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "reportlab>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["app/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

