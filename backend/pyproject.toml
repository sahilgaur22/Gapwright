[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gapwright-backend"
version = "0.1.0"
description = "Automated Syllabus-to-Industry Gap Analyzer backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gapwright Contributors" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
